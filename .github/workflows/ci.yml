name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run python -m ruff check .
      - run: uv run python -m ruff format --check .
      - run: uv run python -m mypy src
      - run: uv run python scripts/validate_documented_cli.py

  offline-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --extra dev
      - run: uv run python scripts/run_tests.py
      - run: uv run python scripts/synthetic_demo.py --output-dir demo-first
      - run: uv run python scripts/synthetic_demo.py --output-dir demo-second
      - run: diff demo-first/demo_manifest.json demo-second/demo_manifest.json

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --extra dev
      - run: uv run python -m build
      - run: python -m venv wheel-smoke
      - run: wheel-smoke/bin/python -m pip install dist/*.whl
      - run: wheel-smoke/bin/geodemand --help
      - run: wheel-smoke/bin/geodemand trends --help
      - run: wheel-smoke/bin/geodemand catalog --help
