[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "geodemand-ff"
version = "0.1.0"
description = "GeoAI research pipeline scaffolding for forecasting regional Google search-demand surges after urban flash floods."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "GeoDemand-FF contributors" },
]
keywords = ["geoai", "flash-floods", "search-demand", "research", "polars"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "geopandas>=1.0",
  "numpy>=2.0",
  "pandas>=2.2",
  "polars>=1.0",
  "pydantic>=2.7",
  "pyarrow>=15.0",
  "pyogrio>=0.9",
  "pyproj>=3.6",
  "PyYAML>=6.0",
  "shapely>=2.0",
  "typer>=0.12",
]

[project.optional-dependencies]
mrms = [
  "cfgrib>=0.9.14",
  "eccodes>=2.39",
  "s3fs>=2025.5",
  "xarray>=2025.1",
]
imerg = [
  "earthaccess>=0.14",
  "h5py>=3.11",
  "requests-cache>=1.2",
  "xarray>=2025.1",
]
usgs = [
  "dataretrieval>=1.0",
  "requests-cache>=1.2",
]
trends-browser = [
  "playwright>=1.52,<2",
]
verification = [
  "cfgrib>=0.9.14",
  "dataretrieval>=1.0",
  "earthaccess>=0.14",
  "eccodes>=2.39",
  "h5py>=3.11",
  "requests-cache>=1.2",
  "s3fs>=2025.5",
  "xarray>=2025.1",
]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
geodemand = "geodemand.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/geodemand"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["geodemand"]

[[tool.mypy.overrides]]
module = [
  "cfgrib",
  "dataretrieval",
  "earthaccess",
  "eccodes",
  "geopandas",
  "h5py",
  "numpy",
  "pandas",
  "pyarrow",
  "pyarrow.*",
  "pyogrio",
  "pyproj",
  "pyproj.*",
  "s3fs",
  "shapely",
  "shapely.*",
  "xarray",
  "xarray.*",
  "yaml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
  "trends_official_api_integration: opt-in official Google Trends API integration",
  "trends_manual_csv_integration: opt-in real manual CSV integration",
  "trends_classic_experimental_integration: opt-in classic web technical check",
  "trends_browser_integration: opt-in visible-browser Google Trends integration",
  "trends_browser_download_integration: opt-in supervised browser download integration",
]
