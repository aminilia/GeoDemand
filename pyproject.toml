[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "geodemand-ff"
version = "0.1.0"
description = "GeoAI research pipeline scaffolding for forecasting regional Google search-demand surges after urban flash floods."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "GeoDemand-FF contributors" },
]
keywords = ["geoai", "flash-floods", "search-demand", "research", "polars"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "polars>=1.0",
  "pydantic>=2.7",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
geodemand = "geodemand.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/geodemand"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["geodemand"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
