rule_version: usgs-response-v1
coverage:
  minimum_fraction: 0.75
  minimum_pre_event_observations: 3
  minimum_event_observations: 2
  minimum_cadence_observations: 4
  maximum_interval_deviation_fraction: 0.25
association:
  allowed_quality_categories:
    - inside_episode_geometry
    - inside_25km_buffer
    - nearby_within_50km
response:
  zero_baseline_epsilon: 1.0e-9
  discharge:
    minimum_absolute_rise: 1.0
    minimum_relative_ratio: 1.25
  gage_height:
    minimum_absolute_rise: 0.10
    minimum_relative_ratio: 1.05
quality:
  excluded_qualifiers: [Ice, Eqp, Bkw]
  allowed_approval_statuses: [approved, provisional]
  allow_provisional_observations: true
  maximum_provisional_fraction: 1.0
