interpretation_notes:
  outage: Broad service-disruption signal; not proof of an electricity outage.
  traffic: Not flood-specific without supporting flood or weather-term increases.
  road_closed: Natural-language alternative to the formal noun phrase road closure.
  school_closed: Natural-language alternative to the formal noun phrase school closure.
  closure: Excluded as a standalone primary term because it is highly ambiguous.

